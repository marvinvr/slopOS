<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>slopOS</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="modulepreload" href="/runtime/bootstrap.js" />
    <link rel="modulepreload" href="/runtime/react.js" />
    <link rel="modulepreload" href="/runtime/jsx-runtime.js" />
    <link rel="modulepreload" href="/runtime/sdk.js" />
    <link rel="preload" href="/runtime/runtime.css" as="style" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('slop-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var mode = saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light'
          document.documentElement.dataset.theme = mode
          document.documentElement.style.colorScheme = mode
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
